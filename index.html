<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vault Ledger">
<meta name="application-name" content="Vault Ledger">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./vault-ledger-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<title>Vault Ledger • Gestão Financeira Inteligente</title>
<style>
 @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 :root{
  --bg:#F8FAFC;
  --bg-card:#FFFFFF;
  --bg-elevated:#F1F5F9;
  --bg-hover:#EFF6FF;
  --border:#E2E8F0;
  --border2:#CBD5E1;
  --text:#0F172A;
  --text-secondary:#475569;
  --text-muted:#94A3B8;
  --accent:#2563EB;
  --accent-light:#EFF6FF;
  --accent-dark:#1D4ED8;
  --success:#16A34A;
  --success-light:#F0FDF4;
  --warning:#D97706;
  --warning-light:#FFFBEB;
  --danger:#DC2626;
  --danger-light:#FEF2F2;
  --purple:#7C3AED;
  --purple-light:#F5F3FF;
  --pink:#DB2777;
  --pink-light:#FDF2F8;
  --radius:14px;
  --radius-sm:10px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(0,0,0,.08);
  --ff:'Inter',system-ui,sans-serif;
  --fh:'Plus Jakarta Sans',system-ui,sans-serif;
 }
 html,body{height:100%;overflow:hidden}
 body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
 #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1400px;margin:0 auto}

 /* HEADER */
 .header{padding:12px 20px 10px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:0 1px 0 var(--border)}
 .header-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
 .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
 .brand-icon{width:38px;height:38px;border-radius:12px;object-fit:cover;box-shadow:var(--sh);flex-shrink:0}
 .header-title{font-family:var(--fh);font-size:20px;font-weight:800;letter-spacing:-.45px;color:#1E3A5F;display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.05}
 .header-title svg{color:var(--accent)}
 .header-subtitle{font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
 .header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
 @media(max-width:560px){
  .header{padding:10px 12px}
  .header-top{align-items:center}
  .brand-icon{width:34px;height:34px;border-radius:10px}
  .header-title{font-size:18px}
  .header-subtitle{max-width:150px}
  .header-actions .icon-btn{padding:7px 10px;font-size:12px}
 }
 .icon-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary);padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:5px;font-family:var(--ff)}
 .icon-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

 /* TABS */
 .tabs{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tab{padding:7px 14px;background:transparent;border:none;border-radius:8px;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s;font-family:var(--ff)}
 .tab:hover{background:var(--bg-elevated);color:var(--text-secondary)}
 .tab.active{background:var(--accent);color:#fff;font-weight:600}

 /* CONTENT */
 .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;-webkit-overflow-scrolling:touch;background:var(--bg)}
 .content::-webkit-scrollbar{width:6px}
 .content::-webkit-scrollbar-track{background:transparent}
 .content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
 .page{display:none}
 .page.active{display:block;animation:fadeIn .15s}
 @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

 /* PERIOD */
 .period-selector{display:flex;gap:8px;margin-bottom:16px;align-items:center}
 .period-btn{background:#fff;border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:var(--ff)}
 .period-btn:hover{border-color:var(--accent);color:var(--accent)}
 .period-display{font-size:13px;color:var(--text-muted);margin-left:auto;font-weight:500}

 /* CARDS */
 .cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
 @media(min-width:768px){.cards-grid{grid-template-columns:repeat(4,1fr)}}
 .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;box-shadow:var(--sh)}
 .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
 .card.success::before{background:var(--success)}
 .card.warning::before{background:var(--warning)}
 .card.danger::before{background:var(--danger)}
 .card.purple::before{background:var(--purple)}
 .card.pink::before{background:var(--pink)}
 .card-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:5px}
 .card-value{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--accent);font-family:var(--fh)}
 .card.success .card-value{color:var(--success)}
 .card.warning .card-value{color:var(--warning)}
 .card.danger .card-value{color:var(--danger)}
 .card.purple .card-value{color:var(--purple)}
 .card.pink .card-value{color:var(--pink)}

 /* SECTION */
 .section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
 .section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.01em}
 .section-title .accent{color:var(--accent)}

 /* TABLE */
 .table{width:100%;border-collapse:collapse;font-size:13px}
 .table th{text-align:left;padding:10px 8px;color:var(--text-muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border)}
 .table td{padding:10px 8px;border-bottom:1px solid var(--border);color:var(--text)}
 .table tr:last-child td{border-bottom:none}
 .table tr:hover td{background:var(--bg-elevated)}
 .table .num{text-align:right;font-variant-numeric:tabular-nums}

 /* TAGS */
 .tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
 .tag-success{background:var(--success-light);color:var(--success)}
 .tag-danger{background:var(--danger-light);color:var(--danger)}
 .tag-warning{background:var(--warning-light);color:var(--warning)}
 .tag-accent{background:var(--accent-light);color:var(--accent)}
 .tag-purple{background:var(--purple-light);color:var(--purple)}
 .tag-pink{background:var(--pink-light);color:var(--pink)}
 .tag-muted{background:var(--bg-elevated);color:var(--text-secondary)}

 /* FAB */
 .fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(37,99,235,.35);z-index:50;display:flex;align-items:center;justify-content:center;transition:all .15s}
 .fab:hover{background:var(--accent-dark);transform:scale(1.05)}
 .fab:active{transform:scale(.95)}

 /* MODAL */
 .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
 @media(min-width:768px){.modal-backdrop{align-items:center}}
 .modal-backdrop.show{display:flex}
 .modal{background:#fff;border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px;animation:slideUp .2s ease;box-shadow:var(--sh-md)}
 @media(min-width:768px){.modal{border-radius:var(--radius)}}
 @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
 .modal-title{font-size:17px;font-weight:800;margin-bottom:16px;font-family:var(--fh);color:var(--text)}
 .modal-actions{display:flex;gap:8px;margin-top:20px}

 /* FORM */
 .form-group{margin-bottom:14px}
 .form-label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
 .form-input,.form-select,.form-textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:var(--ff);transition:border-color .15s;-webkit-appearance:none;outline:none}
 .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);background:#fff}
 .form-textarea{resize:vertical;min-height:60px}
 .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

 /* BUTTONS */
 .btn{flex:1;padding:11px 16px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--ff);transition:all .15s}
 .btn-primary{background:var(--accent);color:#fff}
 .btn-primary:hover{background:var(--accent-dark)}
 .btn-secondary{background:var(--bg-elevated);color:var(--text);border:1.5px solid var(--border)}
 .btn-secondary:hover{background:var(--bg-hover);border-color:var(--accent)}
 .btn-danger{background:var(--danger-light);color:var(--danger);border:1.5px solid rgba(220,38,38,.2)}

 /* CAT BARS */
 .cat-bar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
 .cat-bar-label{flex:1;font-size:13px;font-weight:500}
 .cat-bar-value{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
 .cat-bar-progress{height:5px;background:var(--bg-elevated);border-radius:3px;margin-bottom:12px;overflow:hidden}
 .cat-bar-fill{height:100%;border-radius:3px;transition:width .4s}

 /* EMPTY */
 .empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
 .empty-icon{font-size:36px;margin-bottom:12px;opacity:.35}

 /* TOAST */
 .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:100px;z-index:200;font-size:13px;font-weight:600;box-shadow:var(--sh-md);animation:toastIn .25s ease;white-space:nowrap}
 @keyframes toastIn{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

 /* LIST ITEM */
 .list-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:var(--sh)}
 .list-item:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(37,99,235,.1)}
 .list-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
 .list-item-title{font-weight:600;font-size:14px;color:var(--text)}
 .list-item-value{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;font-family:var(--fh)}
 .list-item-meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
 .dot{width:3px;height:3px;background:var(--text-muted);border-radius:50%;display:inline-block}
 .table-wrapper{overflow-x:auto;margin:0 -16px;padding:0 16px}

 /* PROGRESS RING */
 .progress-ring{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 0}
 .progress-ring-svg{transform:rotate(-90deg)}
 .progress-ring-circle{fill:none;stroke:var(--bg-elevated);stroke-width:8}
 .progress-ring-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s}

 /* CHART */
 .chart-container{height:200px;margin:16px -8px 0;position:relative}
 .chart-bar{transition:opacity .2s;cursor:pointer}
 .chart-bar:hover{opacity:.75}
 .chart-label{font-size:10px;fill:var(--text-muted)}
 .chart-grid{stroke:var(--border);stroke-dasharray:2 4}

 /* BADGE */
 .badge{display:inline-block;background:var(--danger);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:4px}

 /* SWITCH */
 .switch{position:relative;display:inline-block;width:44px;height:24px}
 .switch input{opacity:0;width:0;height:0}
 .slider{position:absolute;cursor:pointer;inset:0;background:var(--bg-elevated);border:1.5px solid var(--border);transition:.2s;border-radius:24px}
 .slider:before{position:absolute;content:"";height:18px;width:18px;left:2px;bottom:2px;background:#fff;transition:.2s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)}
 input:checked+.slider{background:var(--accent);border-color:var(--accent)}
 input:checked+.slider:before{transform:translateX(20px)}

 /* SAFE AREA */
 @supports(padding:max(0px)){
  .header{padding-top:max(14px,env(safe-area-inset-top))}
  .fab{bottom:max(24px,env(safe-area-inset-bottom))}
  .content{padding-bottom:max(80px,env(safe-area-inset-bottom))}
 }

 /* SEARCH & FILTERS */
 .search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
 .search-wrap{position:relative;flex:1}
 .search-input{width:100%;background:#fff;border:1.5px solid var(--border);color:var(--text);padding:9px 12px 9px 36px;border-radius:var(--radius-sm);font-size:14px;font-family:var(--ff);outline:none;transition:border-color .15s;box-shadow:var(--sh)}
 .search-input:focus{border-color:var(--accent)}
 .search-input::placeholder{color:var(--text-muted)}
 .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
 .filter-btn{background:#fff;border:1.5px solid var(--border);color:var(--text-secondary);padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px;font-family:var(--ff);box-shadow:var(--sh)}
 .filter-btn.open{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
 .filter-panel{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;display:none;box-shadow:var(--sh)}
 .filter-panel.open{display:block}
 .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
 .filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-muted);transition:all .15s;white-space:nowrap;font-family:var(--ff)}
 .filter-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
 .filter-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:700;display:block}
 .filter-range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .filter-range input{background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:var(--ff);outline:none;width:100%}
 .filter-range input:focus{border-color:var(--accent)}
 .results-count{font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:500}
 .no-results{text-align:center;padding:32px 20px;color:var(--text-muted);font-size:14px}
 .sort-btn{background:#fff;border:1.5px solid var(--border);color:var(--text-secondary);padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;font-family:var(--ff);transition:all .15s;white-space:nowrap;box-shadow:var(--sh)}
 .sort-btn:hover{border-color:var(--accent);color:var(--accent)}

 /* CHAT IA */
 .chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 130px);max-height:700px}
 .chat-messages{flex:1;overflow-y:auto;padding:4px 0 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
 .chat-messages::-webkit-scrollbar{display:none}
 .chat-msg{display:flex;gap:8px;align-items:flex-end}
 .chat-msg.user{flex-direction:row-reverse}
 .chat-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;box-shadow:var(--sh)}
 .chat-msg.user .chat-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
 .chat-msg.ai .chat-bubble{background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
 .chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700}
 .chat-avatar.ai-av{background:var(--accent-light);color:var(--accent);border:1px solid var(--border)}
 .chat-avatar.user-av{background:var(--accent);color:#fff}
 .chat-input-area{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
 .chat-input{flex:1;background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:10px 14px;border-radius:24px;font-size:14px;font-family:var(--ff);outline:none;resize:none;max-height:100px;transition:border-color .15s;line-height:1.4}
 .chat-input:focus{border-color:var(--accent);background:#fff}
 .chat-input::placeholder{color:var(--text-muted)}
 .chat-send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;align-self:flex-end}
 .chat-send:hover{background:var(--accent-dark)}
 .chat-send:disabled{opacity:.4;cursor:not-allowed}
 .chat-typing{display:flex;gap:4px;align-items:center;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:18px;border-bottom-left-radius:4px;width:fit-content;box-shadow:var(--sh)}
 .chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:blink 1.2s infinite}
 .chat-typing span:nth-child(2){animation-delay:.2s}
 .chat-typing span:nth-child(3){animation-delay:.4s}
 @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
 .chat-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
 .chat-sug{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-secondary);transition:all .15s;font-family:var(--ff);text-align:left}
 .chat-sug:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
 .chat-bubble strong{font-weight:700}
 .chat-bubble ul{padding-left:16px;margin:4px 0}
 .chat-bubble li{margin-bottom:2px}
 .chat-header{background:linear-gradient(135deg,var(--accent-light),var(--purple-light));border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}


 /* AUTH / LOGIN */
 .auth-card{width:100%;max-width:430px;background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--sh-md)}
 .auth-logo-wrap{text-align:center;margin-bottom:22px}
 .auth-app-icon{width:68px;height:68px;border-radius:18px;object-fit:cover;box-shadow:var(--sh-md);margin:0 auto 12px;display:block}
 .auth-logo{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-weight:800;font-size:36px;color:#1E3A5F;letter-spacing:-1.5px;line-height:1;white-space:nowrap}
 .auth-tagline{font-family:'Inter',sans-serif;font-weight:500;font-size:10.5px;color:#64748B;letter-spacing:3.2px;margin-top:7px;text-transform:uppercase}
 .auth-title{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px;text-align:center}
 .auth-subtitle{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:18px;line-height:1.5}
 .auth-actions{display:flex;gap:8px;margin-top:14px}
 .auth-link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff);padding:4px;text-decoration:none}
 .auth-link:hover{text-decoration:underline}
 .auth-alert{font-size:12px;line-height:1.5;padding:10px 12px;border-radius:12px;margin-bottom:12px;border:1px solid var(--border)}
 .auth-alert.info{background:var(--accent-light);color:var(--accent)}
 .auth-alert.error{background:var(--danger-light);color:var(--danger);border-color:rgba(220,38,38,.2)}

function normalizeEmail(email) {
 return String(email || '').trim().toLowerCase();
}

function safeEmailKey(email) {
 return normalizeEmail(email).replace(/[^a-z0-9._-]/g, '_');
}

function userDataKey(email) {
 return STORAGE_KEY + '_user_' + safeEmailKey(email);
}

function hasLocalFinancialDataForActiveUser() {
 try {
  // SaaS: dados locais só podem ser considerados se estiverem vinculados ao e-mail logado.
  // Nunca migrar automaticamente a chave antiga/global, para evitar que um novo usuário receba dados de outro.
  return !!(ACTIVE_USER && ACTIVE_USER.email && localStorage.getItem(userDataKey(ACTIVE_USER.email)));
 } catch (e) {
  return false;
 }
}

function emptyDataTemplate() {
 return {
  config: { saldoInicial: 0, dataCorte: todayISO ? todayISO() : new Date().toISOString().slice(0,10), userName: '', userEmail: '' },
  receitas: [],
  despesas: [],
  emprestimos: [],
  investimentos: [],
  metas: { lista: [] },
  devolucoes: [],
  donosTerceiros: []
 };
}

function cloneDefaultData() {
 return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function loadData() {
 try {
  if (ACTIVE_USER && ACTIVE_USER.email) {
   const userStored = localStorage.getItem(userDataKey(ACTIVE_USER.email));
   if (userStored) return JSON.parse(userStored);
   // Usuário logado sem dados próprios começa limpo.
   return emptyDataTemplate();
  }
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) return JSON.parse(stored);
 } catch (e) {
  console.error('Erro ao carregar:', e);
 }
 return emptyDataTemplate();
}

function saveData(options = {}) {
 try {
  const key = (ACTIVE_USER && ACTIVE_USER.email) ? userDataKey(ACTIVE_USER.email) : STORAGE_KEY;
  localStorage.setItem(key, JSON.stringify(DATA));
 } catch (e) {
  showToast('Erro ao salvar dados localmente');
  console.error(e);
 }
 if (ACTIVE_USER && CLOUD_READY && !options.localOnly) {
  scheduleCloudSave();
 }
}

function nextId(arr) {
 return arr.length === 0 ? 1 : Math.max(...arr.map(x => x.id || 0)) + 1;

function esc(v) {

  if (!m.status) m.status = 'Ativa';
  if (!Array.isArray(m.aportes)) m.aportes = [];
  m.aportes.forEach((a, aidx) => { if (!a.id) a.id = aidx + 1; });
 });
}

function allMetaAportes() {
 ensureMetasFormat();
 return DATA.metas.lista.flatMap(meta => (meta.aportes || []).map(a => ({ ...a, metaId: meta.id, metaNome: meta.nome })));
}

function aporteDateISO(a) {
 if (a.data) return a.data;
 if (a.mes) {
  const partes = String(a.mes).split('/');
  if (partes.length === 2) {
   const mesNome = partes[0].trim().toLowerCase();
   const ano = parseInt(partes[1], 10);
   const idx = MESES_NOMES.findIndex(m => m.toLowerCase() === mesNome);
   if (idx >= 0 && ano) return `${ano}-${pad(idx+1)}-01`;
  }
 }
 return null;
}

// ============================================================
// HELPERS
// ============================================================
function fmt(n) {
 if (n === null || n === undefined || isNaN(n)) return 'R$ 0,00';
 return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function fmtDate(d) {
 if (!d) return '-';
 const [y, m, day] = d.split('-');
 return `${day}/${m}/${y}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function todayISO() {
 const d = new Date();
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function parseDate(s) {
 if (!s) return null;
 return new Date(s + 'T00:00:00');
}

let CURRENT_PERIOD = {
 month: 5,
 year: 2026
};

// ============================================================
// CÁLCULOS
// ============================================================
function calcSaldoAtual() {
 const corte = parseDate(DATA.config.dataCorte);
 let saldo = DATA.config.saldoInicial;
 
 // Receitas com dataReceb >= corte
 DATA.receitas.forEach(r => {
  if (r.dataReceb && r.valor) {
   const d = parseDate(r.dataReceb);
   if (d >= corte) saldo += r.valor;
  }
 });
 
 // Despesas com dataPgto >= corte
 DATA.despesas.forEach(d => {
  if (d.dataPgto && d.valor) {
   const dt = parseDate(d.dataPgto);
   if (dt >= corte) saldo -= d.valor;
  }
 });
 
 // Empréstimos PRÓPRIOS pagos (capital volta) com dataPgto >= corte
 DATA.emprestimos.forEach(e => {
  if (e.origem === 'Próprio' && e.dataPgto) {
   const d = parseDate(e.dataPgto);
   if (d >= corte) saldo += e.valor;
  }
 });
 
 // Empréstimos PRÓPRIOS novos (capital saiu) com dataEmp > corte
 DATA.emprestimos.forEach(e => {
  if (e.origem === 'Próprio' && e.dataEmp) {
   const d = parseDate(e.dataEmp);
   if (d > corte) saldo -= e.valor;
  }
 });
 
 // Empréstimos de TERCEIRO pagos: capital ENTRA na conta (até ser devolvido)
 DATA.emprestimos.forEach(e => {
  if (e.origem === 'Terceiro' && e.dataPgto) {
   const d = parseDate(e.dataPgto);
   if (d >= corte) saldo += e.valor;
  }
 });
 
 // Devoluções pra terceiros: SAI do saldo
 if (DATA.devolucoes) {
  DATA.devolucoes.forEach(dev => {
   if (dev.data && dev.valor) {
    const d = parseDate(dev.data);
    if (d >= corte) saldo -= dev.valor;
   }
  });
 }
 
 // Aportes em metas: saem do saldo disponível, mas continuam no patrimônio como reserva interna
 allMetaAportes().forEach(a => {
  const data = aporteDateISO(a);
  if (data && a.valor) {
   const d = parseDate(data);
   if (d >= corte) saldo -= a.valor || 0;
  }
 });
 
 return saldo;
}


function calcSaldoAte(dataLimiteISO = null) {
 const corte = parseDate(DATA.config.dataCorte);
 const limite = dataLimiteISO ? parseDate(dataLimiteISO) : null;
 let saldo = DATA.config.saldoInicial || 0;

 function dentroDoPeriodo(dataISO, incluirCorte = true) {
  const d = parseDate(dataISO);
  if (!d) return false;
  if (incluirCorte ? d < corte : d <= corte) return false;
  if (limite && d > limite) return false;
  return true;
 }

 DATA.receitas.forEach(r => {
  if (r.dataReceb && r.valor && dentroDoPeriodo(r.dataReceb, true)) saldo += r.valor;
 });

 DATA.despesas.forEach(d => {
  if (d.dataPgto && d.valor && dentroDoPeriodo(d.dataPgto, true)) saldo -= d.valor;
 });

 DATA.emprestimos.forEach(e => {
  if (e.origem === 'Próprio' && e.dataPgto && dentroDoPeriodo(e.dataPgto, true)) saldo += e.valor || 0;
 });

 DATA.emprestimos.forEach(e => {
  if (e.origem === 'Próprio' && e.dataEmp && dentroDoPeriodo(e.dataEmp, false)) saldo -= e.valor || 0;
 });

 DATA.emprestimos.forEach(e => {
  if (e.origem === 'Terceiro' && e.dataPgto && dentroDoPeriodo(e.dataPgto, true)) saldo += e.valor || 0;
 });

 if (DATA.devolucoes) {
  DATA.devolucoes.forEach(dev => {
   if (dev.data && dev.valor && dentroDoPeriodo(dev.data, true)) saldo -= dev.valor || 0;
  });
 }

 allMetaAportes().forEach(a => {
  const data = aporteDateISO(a);
  if (data && a.valor && dentroDoPeriodo(data, true)) saldo -= a.valor || 0;
 });

 return saldo;
}

function endOfMonthISO(month, year) {
 const lastDay = new Date(year, month, 0).getDate();
 return `${year}-${pad(month)}-${pad(lastDay)}`;
}

function calcCapitalProprioRodando() {
 return DATA.emprestimos
  .filter(e => e.origem === 'Próprio' && getStatus(e) !== 'Pago')
  .reduce((s, e) => s + (e.valor || 0), 0);
}

function calcCapitalTerceiros() {
 return DATA.emprestimos
  .filter(e => e.origem === 'Terceiro' && getStatus(e) !== 'Pago')
  .reduce((s, e) => s + (e.valor || 0), 0);
}

function calcInvestimentos() {
 let aportes = 0, resgates = 0, rendimentos = 0;
 DATA.investimentos.forEach(i => {
  if (i.movimento === 'Aporte') aportes += i.valor || 0;
  else if (i.movimento === 'Resgate') resgates += i.valor || 0;
  else if (i.movimento === 'Rendimento') rendimentos += i.valor || 0;
 });
 return { total: aportes - resgates, rendimentos };
}

function calcPatrimonio() {
 return calcSaldoAtual() + calcCapitalProprioRodando() + calcInvestimentos().total + (calcMetaAcumulada());
}

function calcMetaAcumulada() {
 return allMetaAportes().reduce((s, a) => s + (a.valor || 0), 0);
}

function calcMetaValorTotal() {
 ensureMetasFormat();
 return DATA.metas.lista.filter(m => m.status !== 'Arquivada').reduce((s, m) => s + (m.valorMeta || 0), 0);
}

function getStatus(e) {
 if (!e.valor) return '';
 if (e.dataPgto) return 'Pago';
 const hoje = new Date();
 hoje.setHours(0,0,0,0);
 const acordada = parseDate(e.dataAcordada);
 if (acordada && hoje > acordada) return 'Atrasado';
 return 'Em aberto';
}

function calcReceitasMes(mes, ano, categoria = null) {
 return DATA.receitas
  .filter(r => {
   if (!r.dataReceb || !r.valor) return false;
   const d = parseDate(r.dataReceb);
   if (d.getMonth()+1 !== mes || d.getFullYear() !== ano) return false;
   if (categoria && r.categoria !== categoria) return false;
   return true;
  })
  .reduce((s, r) => s + r.valor, 0);
}

function calcDespesasPagas(mes, ano, categoria = null, necessario = null) {
 return DATA.despesas
  .filter(d => {
   if (!d.dataPgto || !d.valor) return false;
   const dt = parseDate(d.dataPgto);
   if (dt.getMonth()+1 !== mes || dt.getFullYear() !== ano) return false;
   if (categoria && d.categoria !== categoria) return false;
   if (necessario !== null && d.necessario !== necessario) return false;
   return true;
  })
  .reduce((s, d) => s + d.valor, 0);
}

function calcDespesasPendentes(mes, ano, categoria = null) {
 return DATA.despesas
  .filter(d => {
   if (d.dataPgto || !d.valor || !d.data) return false;
   const dt = parseDate(d.data);
   if (dt.getMonth()+1 !== mes || dt.getFullYear() !== ano) return false;
   if (categoria && d.categoria !== categoria) return false;
   return true;
  })
  .reduce((s, d) => s + d.valor, 0);
}

function render() {
 const tab = document.querySelector('.tab.active').dataset.page;
 const content = document.getElementById('content');
 
 // FAB visibility
 const fab = document.getElementById('fab');
 if (['receitas', 'despesas', 'emprestimos', 'investimentos'].includes(tab)) {
  fab.style.display = 'flex';
 } else if (tab === 'metas') {
  fab.style.display = 'flex';
 } else if (tab === 'devolucoes') {
  fab.style.display = 'flex';
 } else {
  fab.style.display = 'none';
 }
 
 switch (tab) {
  case 'dashboard': content.innerHTML = renderDashboard(); break;
  case 'receitas': content.innerHTML = renderReceitas(); break;
  case 'despesas': content.innerHTML = renderDespesas(); break;
  case 'emprestimos': content.innerHTML = renderEmprestimos(); break;
  case 'capitais': content.innerHTML = renderCapitais(); break;
  case 'investimentos': content.innerHTML = renderInvestimentos(); break;
  case 'metas': content.innerHTML = renderMetas(); break;
  case 'patrimonio': content.innerHTML = renderPatrimonio(); break;
  case 'devolucoes': content.innerHTML = renderDevolucoes(); break;
  case 'analise': content.innerHTML = renderAnalise(); break;
  case 'ia': content.innerHTML = renderIA(); setupChat(); break;
  case 'config': content.innerHTML = renderConfig(); break;
  case 'admin': content.innerHTML = renderAdmin(); break;
 }
 
 // Period selector listener
 const prevMonthBtn = document.getElementById('prevMonthBtn');
 const nextMonthBtn = document.getElementById('nextMonthBtn');
 const prevYearBtn = document.getElementById('prevYearBtn');
 const nextYearBtn = document.getElementById('nextYearBtn');

 if (prevMonthBtn) prevMonthBtn.onclick = () => changeMonth(-1);
 if (nextMonthBtn) nextMonthBtn.onclick = () => changeMonth(1);
 if (prevYearBtn) prevYearBtn.onclick = () => changeYear(-1);
 if (nextYearBtn) nextYearBtn.onclick = () => changeYear(1);
}

function changeMonth(delta) {
 CURRENT_PERIOD.month += delta;
 while (CURRENT_PERIOD.month < 1) {
  CURRENT_PERIOD.month += 12;
  CURRENT_PERIOD.year -= 1;
 }
 while (CURRENT_PERIOD.month > 12) {
  CURRENT_PERIOD.month -= 12;
  CURRENT_PERIOD.year += 1;
 }
 render();
}

function changeYear(delta) {
 CURRENT_PERIOD.year += delta;
 render();
}

const MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function periodSelector() {
 return `<div class="period-selector">
  <button class="period-btn" id="prevMonthBtn" title="Mês anterior">‹</button>
  <button class="period-btn" style="min-width:120px;cursor:default">${MESES_NOMES[CURRENT_PERIOD.month-1]}</button>
  <button class="period-btn" id="nextMonthBtn" title="Próximo mês">›</button>
  <button class="period-btn" id="prevYearBtn" title="Ano anterior">‹</button>
  <button class="period-btn" style="min-width:70px;cursor:default">${CURRENT_PERIOD.year}</button>
  <button class="period-btn" id="nextYearBtn" title="Próximo ano">›</button>
  <div class="period-display">${MESES_NOMES[CURRENT_PERIOD.month-1]}/${CURRENT_PERIOD.year}</div>
 </div>`;
}

 const despesasPendentes = calcDespesasPendentes(m, y);
 const patrimonio = calcPatrimonio();
 const capitalProprio = calcCapitalProprioRodando();
 const capitalTerceiros = calcCapitalTerceiros();
 const resultadoMes = receitas - despesasPagas;
 
 const categorias = ['Transporte', 'Alimentação', 'Lazer', 'Cartão de Crédito', 'Conta Fixa', 'Outros'];

  'Transporte': 'purple',

  'Lazer': 'warning',

 };

 })).map(x => ({ ...x, total: x.pago + x.pendente }));

 return `

   </div>
   <div class="card success">
    <div class="card-label"> Cap. Próprio</div>
    <div class="card-value">${fmt(capitalProprio)}</div>
   </div>
   <div class="card warning">
    <div class="card-label"> Cap. Terceiros</div>

   </div>
   <div class="card ${resultadoMes >= 0 ? 'success' : 'danger'}">

  <div class="section">
   <div class="section-title"> Gastos por categoria</div>
   ${totaisCat.map(({cat, pago, pendente, total}) => {

 let lista = [...DATA.despesas];

 if (DF.q) {
  const q = DF.q.toLowerCase();
  lista = lista.filter(d => (d.desc||'').toLowerCase().includes(q)||(d.sub||'').toLowerCase().includes(q)||(d.categoria||'').toLowerCase().includes(q));
 }
 if (DF.status === 'pago')  lista = lista.filter(d => !!d.dataPgto);
 if (DF.status === 'pendente') lista = lista.filter(d => !d.dataPgto);
 if (DF.categ !== 'todas')  lista = lista.filter(d => d.categoria === DF.categ);

 if (DF.maxVal !== '') lista = lista.filter(d => (d.valor||0) <= parseFloat(DF.maxVal));

 lista.sort((a,b) => {

  if (DF.sort === 'data_asc') return (a.data||'').localeCompare(b.data||'');

  return 0;
 });

 const cats = ['todas','Transporte','Alimentação','Lazer','Cartão de Crédito','Conta Fixa','Outros'];

function renderCapitais() {
 const proprio = DATA.emprestimos.filter(e => e.origem === 'Próprio');
 const terceiro = DATA.emprestimos.filter(e => e.origem === 'Terceiro');
 
 const stats = (arr) => ({
  aberto: arr.filter(e => getStatus(e) !== 'Pago').reduce((s,e) => s + (e.valor || 0), 0),
  pago: arr.filter(e => getStatus(e) === 'Pago').reduce((s,e) => s + (e.valor || 0), 0),
  jurosAReceber: arr.filter(e => getStatus(e) !== 'Pago').reduce((s,e) => s + (e.valor || 0) * (e.juros || 0), 0),
  jurosRecebidos: arr.filter(e => getStatus(e) === 'Pago').reduce((s,e) => s + (e.valor || 0) * (e.juros || 0), 0),
 });
 
 const sp = stats(proprio);
 const st = stats(terceiro);
 
 return `
  <div class="section">
   <div class="section-title" style="color:var(--accent)"> Próprio</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">

    <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Já recebido</div><div style="font-weight:600">${fmt(sp.pago)}</div></div>
    <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Juros a receber</div><div style="color:var(--success);font-weight:600">${fmt(sp.jurosAReceber)}</div></div>
    <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Juros recebidos</div><div style="color:var(--success);font-weight:600">${fmt(sp.jurosRecebidos)}</div></div>

    <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Já recebido</div><div style="font-weight:600">${fmt(st.pago)}</div></div>
    <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Juros a receber</div><div style="color:var(--success);font-weight:600">${fmt(st.jurosAReceber)}</div></div>
    <div><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Juros recebidos</div><div style="color:var(--success);font-weight:600">${fmt(st.jurosRecebidos)}</div></div>

}

function renderMetas() {
 ensureMetasFormat();
 const metas = DATA.metas.lista;
 const totalAcumulado = calcMetaAcumulada();
 const totalAlvo = calcMetaValorTotal();

 return `
  <div class="section">
   <div class="section-title">
    <span> Metas financeiras</span>
    <button class="filter-btn" onclick="openMetaModal(null)" style="padding:6px 10px">+ Nova meta</button>
   </div>
   <div class="cards-grid">
    <div class="card warning">
     <div class="card-label">Reservado em metas</div>
     <div class="card-value">${fmt(totalAcumulado)}</div>
    </div>
    <div class="card">
     <div class="card-label">Total dos objetivos</div>
     <div class="card-value">${fmt(totalAlvo)}</div>
    </div>
   </div>
   <div style="font-size:12px;color:var(--text-muted);line-height:1.5">
    Aporte em meta reduz o saldo disponível, mas continua entrando no patrimônio como dinheiro reservado.
   </div>
  </div>

  ${metas.length === 0 ? `
   <div class="empty"><div class="empty-icon"></div><div>Nenhuma meta cadastrada.</div></div>
  ` : metas.map(meta => {
   const acumulado = (meta.aportes || []).reduce((s, a) => s + (a.valor || 0), 0);
   const alvo = meta.valorMeta || 0;
   const progresso = alvo > 0 ? Math.min(acumulado / alvo, 1) : 0;
   const falta = Math.max(0, alvo - acumulado);
   const r = 46;
   const circ = 2 * Math.PI * r;
   const offset = circ * (1 - progresso);
   return `
   <div class="section">
    <div class="section-title">
     <span>${esc(meta.nome)}</span>
     <span class="tag tag-${meta.status === 'Concluída' ? 'success' : meta.status === 'Arquivada' ? 'muted' : 'accent'}">${esc(meta.status)}</span>
    </div>

    <div class="progress-ring">
     <svg class="progress-ring-svg" width="124" height="124">
      <circle class="progress-ring-circle" cx="62" cy="62" r="${r}"></circle>
      <circle class="progress-ring-fill" cx="62" cy="62" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
     </svg>
     <div>
      <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Acumulado</div>
      <div style="font-size:24px;font-weight:700;color:var(--accent)">${fmt(acumulado)}</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${(progresso*100).toFixed(0)}% de ${fmt(alvo)}</div>
      ${falta > 0 ? `<div style="font-size:12px;color:var(--warning);margin-top:4px">Faltam ${fmt(falta)}</div>` : `<div style="font-size:12px;color:var(--success);margin-top:4px">Meta atingida</div>`}
     </div>
    </div>

    ${meta.obs ? `<div style="font-size:13px;color:var(--text-secondary);margin:8px 0 12px">${esc(meta.obs)}</div>` : ''}

    <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
     <button class="filter-btn" onclick="openMetaModal(${meta.id})">Editar meta</button>
     <button class="filter-btn" onclick="openAporteModal(${meta.id}, null)">+ Aporte</button>
    </div>

    <div style="border-top:1px solid var(--border);padding-top:10px">
     <div class="section-title" style="margin-bottom:8px">Aportes/depósitos</div>
     ${(meta.aportes || []).length === 0 ? `

function renderAnalise() {
  const m = CURRENT_PERIOD.month;
  const ano = CURRENT_PERIOD.year;
  const mesNome = MESES_NOMES[m - 1];

  const years = getAnalysisYears();
  const receitasMes = calcReceitasMes(m, ano);
  const despesasPagas = calcDespesasPagas(m, ano);
  const despesasPend = calcDespesasPendentes(m, ano);
  const resultadoMes = receitasMes - despesasPagas;
  const jurosMes = calcReceitasMes(m, ano, 'Juros');
  const recebimentosPendentes = DATA.receitas.filter(r => !r.dataReceb && r.dataPrev && parseDate(r.dataPrev)?.getMonth()+1 === m && parseDate(r.dataPrev)?.getFullYear() === ano).reduce((s,r)=>s+(r.valor||0),0);
  const emprestimosAbertos = DATA.emprestimos.filter(e => getStatus(e) !== 'Pago').reduce((s,e)=>s+(e.valor||0),0);
  const atrasados = DATA.emprestimos.filter(e => getStatus(e) === 'Atrasado').length;
  const metasReservado = calcMetaAcumulada();

  const dadosAno = MESES_NOMES.map((mes, i) => {
    const mm = i + 1;
    const rec = calcReceitasMes(mm, ano);
    const despPagas = calcDespesasPagas(mm, ano);
    const despPend = calcDespesasPendentes(mm, ano);
    const desp = despPagas + despPend;
    const juros = calcReceitasMes(mm, ano, 'Juros');
    return { mes, rec, desp, despPagas, despPend, resultado: rec - despPagas, juros };
  });
  const totais = {
    rec: dadosAno.reduce((s,d) => s + d.rec, 0),
    desp: dadosAno.reduce((s,d) => s + d.despPagas, 0),
    despTotal: dadosAno.reduce((s,d) => s + d.desp, 0),
    resultado: dadosAno.reduce((s,d) => s + d.resultado, 0),
    juros: dadosAno.reduce((s,d) => s + d.juros, 0),
  };

  const annualSeries = dadosAno.map(d => ({ label: d.mes.substring(0,3), values: [d.rec, d.despPagas] }));
  const chartHTML = renderBarChart(annualSeries, ['var(--success)', 'var(--danger)'], Math.max(...dadosAno.map(d => Math.max(d.rec, d.despPagas)), 100), { large: true });

  const catsMonth = getExpenseCategoryData(m, ano, false);
  const totalCatMonth = catsMonth.reduce((s,x)=>s+x.valor,0);
  const maiorCat = catsMonth[0];
  const catsYear = getExpenseCategoryData(null, ano, true);
  const totalCatYear = catsYear.reduce((s,x)=>s+x.valor,0);

  const yearTotals = years.map(y => {
    const rec = MESES_NOMES.reduce((s,_,idx)=>s+calcReceitasMes(idx+1,y),0);
    const desp = MESES_NOMES.reduce((s,_,idx)=>s+calcDespesasPagas(idx+1,y),0);
    return { label:String(y), values:[rec, desp], rec, desp, result:rec-desp };
  });
  const yearChart = renderBarChart(yearTotals, ['var(--success)', 'var(--danger)'], Math.max(...yearTotals.map(d=>Math.max(d.rec,d.desp)),100), { large:false });

  const diag = resultadoMes >= 0
    ? `No mês selecionado, o resultado está positivo em <strong>${fmt(resultadoMes)}</strong>.`
    : `No mês selecionado, as despesas pagas superam as receitas em <strong>${fmt(Math.abs(resultadoMes))}</strong>.`;

  return `
    <div class="section">
      <div class="section-title">Análise financeira</div>
      ${periodSelector()}
      <div class="analysis-year-strip">
        ${years.map(y => `<button class="year-pill ${y===ano?'active':''}" onclick="setAnalysisYear(${y})">${y}</button>`).join('')}
        ${!years.includes(ano+1) ? `<button class="year-pill" onclick="setAnalysisYear(${ano+1})">${ano+1}</button>` : ''}
      </div>
      <div class="diagnostic-box">
        ${diag} ${maiorCat ? `A maior concentração de despesas do mês está em <strong>${maiorCat.cat}</strong>, com <strong>${fmt(maiorCat.valor)}</strong>.` : 'Não há despesas registradas por categoria neste mês.'}
        ${atrasados > 0 ? ` Existem <strong>${atrasados}</strong> registro(s) em atraso que exigem atenção.` : ' Não há registros em atraso no momento.'}
      </div>
    </div>

    <div class="metric-grid">
      <div class="metric-card success"><div class="metric-label">Receitas do mês</div><div class="metric-value">${fmt(receitasMes)}</div><div class="metric-note">Recebidas em ${mesNome}/${ano}</div></div>
      <div class="metric-card danger"><div class="metric-label">Despesas pagas</div><div class="metric-value">${fmt(despesasPagas)}</div><div class="metric-note">Pagamentos confirmados</div></div>
      <div class="metric-card warning"><div class="metric-label">Despesas pendentes</div><div class="metric-value">${fmt(despesasPend)}</div><div class="metric-note">Ainda em aberto</div></div>
      <div class="metric-card ${resultadoMes >= 0 ? 'success' : 'danger'}"><div class="metric-label">Resultado</div><div class="metric-value">${fmt(resultadoMes)}</div><div class="metric-note">Receitas menos despesas pagas</div></div>
    </div>

    <div class="metric-grid">
      <div class="metric-card"><div class="metric-label">Receitas pendentes</div><div class="metric-value">${fmt(recebimentosPendentes)}</div><div class="metric-note">Previstas e não recebidas</div></div>
      <div class="metric-card success"><div class="metric-label">Juros recebidos</div><div class="metric-value">${fmt(jurosMes)}</div><div class="metric-note">Receitas da categoria Juros</div></div>
      <div class="metric-card purple"><div class="metric-label">Em aberto</div><div class="metric-value">${fmt(emprestimosAbertos)}</div><div class="metric-note">Registros financeiros ainda não pagos</div></div>
      <div class="metric-card warning"><div class="metric-label">Reservado em metas</div><div class="metric-value">${fmt(metasReservado)}</div><div class="metric-note">Total aportado nas metas</div></div>
    </div>

    <div class="analysis-grid-wide">
      <div class="section">
        <div class="section-title">Evolução mensal — ${ano}</div>
        ${chartHTML}
        <div class="chart-legend"><span class="legend-dot success">Receitas</span><span class="legend-dot danger">Despesas pagas</span></div>
      </div>
      <div class="section">
        <div class="section-title">Despesas por categoria — ${ano}</div>
        ${renderCategoryBars(catsYear, totalCatYear)}
      </div>
    </div>

    <div class="analysis-grid-wide">
      <div class="section">
        <div class="section-title">Comparativo por ano</div>
        ${yearChart}
        <div class="chart-legend"><span class="legend-dot success">Receitas</span><span class="legend-dot danger">Despesas pagas</span></div>
      </div>
      <div class="section">
        <div class="section-title">Despesas por categoria — ${mesNome}/${ano}</div>
        ${renderCategoryBars(catsMonth, totalCatMonth)}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Detalhamento anual</div>
      <div class="table-wrapper">
        <table class="table">
          <thead><tr><th>Mês</th><th class="num">Receitas</th><th class="num">Despesas pagas</th><th class="num">Pendentes</th><th class="num">Resultado</th><th class="num">Juros</th></tr></thead>
          <tbody>
            ${dadosAno.map(d => `<tr>
              <td><strong>${d.mes.substring(0,3)}</strong></td>
              <td class="num">${fmt(d.rec)}</td>
              <td class="num">${fmt(d.despPagas)}</td>
              <td class="num">${fmt(d.despPend)}</td>
              <td class="num" style="color:${d.resultado >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(d.resultado)}</td>
              <td class="num" style="color:var(--success)">${fmt(d.juros)}</td>
            </tr>`).join('')}
            <tr style="background:var(--bg-elevated);font-weight:700"><td>Total</td><td class="num">${fmt(totais.rec)}</td><td class="num">${fmt(totais.desp)}</td><td class="num">${fmt(totais.despTotal - totais.desp)}</td><td class="num" style="color:${totais.resultado >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(totais.resultado)}</td><td class="num" style="color:var(--success)">${fmt(totais.juros)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function getAnalysisYears() {
  const years = new Set([CURRENT_PERIOD.year, new Date().getFullYear()]);
  const add = d => { const dt = parseDate(d); if (dt) years.add(dt.getFullYear()); };
  DATA.receitas.forEach(r => { add(r.dataPrev); add(r.dataReceb); });
  DATA.despesas.forEach(d => { add(d.data); add(d.dataPgto); });
  DATA.emprestimos.forEach(e => { add(e.dataEmp); add(e.dataAcordada); add(e.dataPgto); });
  DATA.investimentos.forEach(i => add(i.data));
  DATA.devolucoes?.forEach(d => add(d.data));
  const arr = [...years].filter(Boolean).sort((a,b)=>a-b);
  if (!arr.includes(CURRENT_PERIOD.year+1)) arr.push(CURRENT_PERIOD.year+1);
  return [...new Set(arr)].sort((a,b)=>a-b);
}

function setAnalysisYear(year) {
  CURRENT_PERIOD.year = year;
  render();
}

function getExpenseCategoryData(month, year, wholeYear = false) {
  const cats = [...new Set((DATA.despesas || []).map(d => d.categoria || 'Outros'))];
  const list = cats.map(cat => {
    let valor = 0;
    if (wholeYear) {
      for (let mm = 1; mm <= 12; mm++) valor += calcDespesasPagas(mm, year, cat) + calcDespesasPendentes(mm, year, cat);
    } else {
      valor = calcDespesasPagas(month, year, cat) + calcDespesasPendentes(month, year, cat);
    }
    return { cat, valor };
  }).filter(x => x.valor > 0).sort((a,b)=>b.valor-a.valor);
  return list;
}

function renderCategoryBars(data, total) {
  if (!data || data.length === 0) return `<div class="empty" style="padding:24px">Nenhuma despesa encontrada neste período.</div>`;
  return data.map(({cat, valor}) => {
    const pct = total > 0 ? (valor / total) * 100 : 0;
    return `
      <div class="cat-bar"><span class="cat-bar-label">${esc(cat)}</span><span class="cat-bar-value">${fmt(valor)}</span><span style="font-size:11px;color:var(--text-muted);min-width:42px;text-align:right">${pct.toFixed(0)}%</span></div>
      <div class="cat-bar-progress"><div class="cat-bar-fill" style="width:${pct}%;background:var(--accent)"></div></div>`;
  }).join('');
}

function renderBarChart(data, colors, maxVal, opts = {}) {
 const W = opts.large ? 720 : 420, H = opts.large ? 260 : 210;
 const safeData = data && data.length ? data : [{ label:'-', values:[0,0] }];
 const barGroupWidth = (W - 34) / safeData.length;
 const numSeries = safeData[0].values.length;
 const barWidth = Math.max(7, (barGroupWidth - 7) / numSeries);
 
 let bars = '';
 safeData.forEach((d, i) => {
  d.values.forEach((v, j) => {
   const h = maxVal > 0 ? (v / maxVal) * (H - 52) : 0;
   const x = 18 + i * barGroupWidth + j * barWidth + 2;
   const y = H - 28 - h;
   bars += `<rect class="chart-bar" x="${x}" y="${y}" width="${Math.max(4, barWidth - 3)}" height="${h}" fill="${colors[j]}" rx="3"></rect>`;
  });
  bars += `<text class="chart-label" x="${18 + i * barGroupWidth + barGroupWidth/2}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
 });
 
 const gridY1 = H - 28;
 return `<div class="chart-container ${opts.large ? 'large' : ''}">
  <svg width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
   <line class="chart-grid" x1="18" y1="${gridY1}" x2="${W-16}" y2="${gridY1}"></line>
   <line class="chart-grid" x1="18" y1="${Math.round(gridY1*0.66)}" x2="${W-16}" y2="${Math.round(gridY1*0.66)}"></line>
   <line class="chart-grid" x1="18" y1="${Math.round(gridY1*0.33)}" x2="${W-16}" y2="${Math.round(gridY1*0.33)}"></line>
   ${bars}
  </svg>
 </div>`;
}

// ============================================================
// PAGE: DEVOLUÇÕES
// ============================================================
function renderDevolucoes() {
 // Garantir estruturas
 if (!DATA.devolucoes) DATA.devolucoes = [];
 if (!DATA.donosTerceiros) DATA.donosTerceiros = ['Pai', 'Santander Pix Crédito'];
 
 // Calcular saldo por dono
 const saldosPorDono = {};
 DATA.donosTerceiros.forEach(dono => {
  saldosPorDono[dono] = {
   capitalRecebido: 0, // capital de terceiro pago pelo cliente (entrou na conta)
   jaDevolvido: 0,   // devoluções feitas pra esse dono
   capitalEmAberto: 0, // capital ainda emprestado
   jurosRecebidos: 0, // juros já recebidos desse dono
  };
 });
 
 DATA.emprestimos.forEach(e => {
  if (e.origem !== 'Terceiro') return;
  const dono = e.donoTerceiro || 'Pai';
  if (!saldosPorDono[dono]) {
   saldosPorDono[dono] = { capitalRecebido: 0, jaDevolvido: 0, capitalEmAberto: 0, jurosRecebidos: 0 };
  }
  
  const status = getStatus(e);
  if (status === 'Pago') {
   saldosPorDono[dono].capitalRecebido += e.valor || 0;
   saldosPorDono[dono].jurosRecebidos += (e.valor || 0) * (e.juros || 0);
  } else {
   saldosPorDono[dono].capitalEmAberto += e.valor || 0;
  }
 });
 
 DATA.devolucoes.forEach(d => {
  if (saldosPorDono[d.dono]) {
   saldosPorDono[d.dono].jaDevolvido += d.valor || 0;
  }
 });
 
 // Calcular pendentes
 let totalPendente = 0;
 let temPendencia = false;
 Object.keys(saldosPorDono).forEach(dono => {
  const s = saldosPorDono[dono];
  // Toda origem de terceiro ainda não devolvida é pendência, mesmo que o cliente ainda não tenha pago.
  s.pendente = (s.capitalRecebido + s.capitalEmAberto) - s.jaDevolvido;
  if (s.pendente > 0.01) {
   totalPendente += s.pendente;
   temPendencia = true;
  }
 });
 
 return `
  ${temPendencia ? `
   <div class="section" style="border-color:var(--danger);background:rgba(248,113,113,0.05)">
    <div class="section-title" style="color:var(--danger)">️ Capital a devolver</div>
    <div style="font-size:24px;font-weight:700;color:var(--danger);margin-bottom:4px">${fmt(totalPendente)}</div>
    <div style="font-size:12px;color:var(--text-secondary)">Esse é o capital de terceiros que ainda não foi devolvido. Inclui valores já recebidos e valores ainda em aberto com clientes.</div>
   </div>
  ` : `
   <div class="section" style="background:rgba(52,211,153,0.05);border-color:var(--success)">
    <div style="text-align:center;padding:8px;color:var(--success);font-weight:600"> Nenhuma devolução pendente</div>
   </div>
  `}
  
  ${Object.keys(saldosPorDono).map(dono => {
   const s = saldosPorDono[dono];
   const cor = s.pendente > 0.01 ? 'var(--danger)' : 'var(--success)';
   return `
    <div class="section">
     <div class="section-title">
      <span> ${dono}</span>
      <button class="icon-btn" onclick="openDevolucaoModal(null, '${dono.replace(/'/g, "\\'")}')">+ Devolver</button>
     </div>
     
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div>
       <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Em aberto (com clientes)</div>
       <div style="font-weight:600">${fmt(s.capitalEmAberto)}</div>
      </div>
      <div>
       <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Já recebido (cliente pagou)</div>
       <div style="font-weight:600">${fmt(s.capitalRecebido)}</div>
      </div>
      <div>
       <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Já devolvido pra ele</div>
       <div style="color:var(--success);font-weight:600">${fmt(s.jaDevolvido)}</div>
      </div>
      <div>
       <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Pendente de devolução</div>
       <div style="color:${cor};font-weight:700;font-size:16px">${fmt(s.pendente)}</div>
      </div>
     </div>
     
     <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
      <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px"> Meu lucro com esse dono</div>
      <div style="color:var(--success);font-weight:600">${fmt(s.jurosRecebidos)} de juros recebidos</div>
     </div>
    </div>
   `;
  }).join('')}
  
  <div class="section">
   <div class="section-title"> Histórico de devoluções</div>
   ${DATA.devolucoes.length === 0 ? `
    <div style="text-align:center;padding:20px;color:var(--text-muted)">Nenhuma devolução ainda</div>
   ` : [...DATA.devolucoes].sort((a,b) => (b.data||'').localeCompare(a.data||'')).map(d => `
    <div class="list-item" onclick="openDevolucaoModal(${d.id})">
     <div class="list-item-header">
      <div>
       <div class="list-item-title">${d.dono}</div>
       <div class="list-item-meta">
        <span> ${fmtDate(d.data)}</span>
        ${d.obs ? `<span>${d.obs}</span>` : ''}
       </div>
      </div>
      <div class="list-item-value" style="color:var(--danger)">- ${fmt(d.valor)}</div>
     </div>
    </div>
   `).join('')}
  </div>
  
  <div class="section">
   <div class="section-title">️ Donos cadastrados</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    ${DATA.donosTerceiros.map(d => `<span class="tag tag-purple">${d}</span>`).join('')}
   </div>
   <button class="btn btn-secondary" onclick="addDonoTerceiro()" style="width:100%">+ Adicionar dono</button>
  </div>
 `;
}

function addDonoTerceiro() {
 const nome = prompt('Nome do dono do capital (ex: Pai, João, Empresa X):');
 if (!nome || !nome.trim()) return;
 if (!DATA.donosTerceiros) DATA.donosTerceiros = [];
 if (DATA.donosTerceiros.includes(nome.trim())) {
  showToast('Esse dono já existe');
  return;
 }
 DATA.donosTerceiros.push(nome.trim());
 saveData();
 render();
 showToast('Dono adicionado: ' + nome);
}

 const d = id ? DATA.devolucoes.find(x => x.id === id) : {
  data: todayISO(),
  dono: donoSugerido || (DATA.donosTerceiros[0] || 'Pai'),
  valor: '',
  obs: ''
 };
 const isEdit = !!id;
 
 showModal(`
  <div class="modal-title">${isEdit ? '️ Editar' : ' Nova'} Devolução</div>
  <div class="form-group">
   <label class="form-label">Data</label>
   <input class="form-input" type="date" id="dv_data" value="${d.data || ''}">
  </div>
  <div class="form-group">
   <label class="form-label">Dono do capital</label>
   <select class="form-select" id="dv_dono">
    ${DATA.donosTerceiros.map(dn => `<option value="${dn}" ${d.dono === dn ? 'selected' : ''}>${dn}</option>`).join('')}
   </select>
  </div>

function renderChatMsg(msg) {
 const isUser = msg.role === 'user';

function setupChat() {
 const msgs = document.getElementById('chatMessages');
 if (msgs) msgs.scrollTop = msgs.scrollHeight;
 const input = document.getElementById('chatInput');
 if (input) input.focus();
}

function autoResize(el) {
 el.style.height = 'auto';
 el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleChatKey(e) {
 if (e.key === 'Enter' && !e.shiftKey) {
  e.preventDefault();
  sendChat();
 }
}

function sendSuggestion(text) {
 const input = document.getElementById('chatInput');
 if (input) { input.value = text; autoResize(input); }
 sendChat();
}

async function sendChat() {
 if (chatLoading) return;
 const input = document.getElementById('chatInput');
 const text = input ? input.value.trim() : '';
 if (!text) return;

 // Adiciona mensagem do usuário
 chatHistory.push({ role: 'user', content: text });
 if (input) { input.value = ''; input.style.height = 'auto'; }

 // Esconde sugestões após primeira mensagem
 const sugs = document.getElementById('chatSugs');
 if (sugs) sugs.style.display = 'none';

 chatLoading = true;
 renderChatMessages(true);

 try {
  const systemPrompt = buildFinancialContext();
  const messages = chatHistory.map(m => ({ role: m.role, content: m.content }));

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({
    model: 'claude-sonnet-4-20250514',
    max_tokens: 1000,
    system: systemPrompt,
    messages: messages
   })
  });

  const data = await resp.json();

  if (data.content && data.content[0]) {
   const reply = data.content[0].text;
   chatHistory.push({ role: 'assistant', content: reply });
  } else if (data.error) {
   chatHistory.push({ role: 'assistant', content: `Erro: ${data.error.message || 'Falha na API'}` });
  }
 } catch (err) {
  chatHistory.push({ role: 'assistant', content: 'Não foi possível conectar à IA. Verifique sua conexão e tente novamente.' });
 }

 chatLoading = false;
 renderChatMessages(false);
}

function renderChatMessages(loading) {
 const msgs = document.getElementById('chatMessages');
 if (!msgs) return;

 msgs.innerHTML = chatHistory.map(m => renderChatMsg(m)).join('') +
  (loading ? `<div class="chat-msg ai"><div class="chat-avatar ai-av">IA</div><div class="chat-typing"><span></span><span></span><span></span></div></div>` : '');

 msgs.scrollTop = msgs.scrollHeight;

 const btn = document.getElementById('chatSendBtn');
 if (btn) btn.disabled = loading;
}

function isAdminUser() {
 return !!ACTIVE_PROFILE?.is_admin;
}

function isProfilePastDue(p) {
 if (!p || !p.subscription_due_date) return false;
 if (p.is_admin) return false;
 const today = new Date(); today.setHours(0,0,0,0);
 const due = parseDate(p.subscription_due_date);
 return !!due && due < today;
}

function isProfileDueSoon(p) {
 if (!p || !p.subscription_due_date || isProfilePastDue(p)) return false;
 const today = new Date(); today.setHours(0,0,0,0);
 const due = parseDate(p.subscription_due_date);
 if (!due) return false;
 const days = Math.ceil((due - today) / 86400000);
 return days >= 0 && days <= 7;
}

function profileMonthlyValue(p) {
 const plan = p?.subscription_plan || 'mensal';
 if (plan === 'trimestral') return 0;
 if (plan === 'anual') return 0;
 return 0;
}

function filterAdminProfiles(profiles) {
 let out = [...profiles];
 const q = (ADMIN_FILTER.q || '').toLowerCase().trim();
 const st = ADMIN_FILTER.status || 'todos';
 if (q) out = out.filter(p => (p.email||'').toLowerCase().includes(q) || (p.nome||'').toLowerCase().includes(q));
 if (st !== 'todos') {
  if (st === 'liberados') out = out.filter(p => ['trial','active'].includes(p.subscription_status) && !p.blocked && !isProfilePastDue(p));
  else if (st === 'restritos') out = out.filter(p => p.blocked || ['blocked','canceled','past_due'].includes(p.subscription_status) || isProfilePastDue(p));
  else if (st === 'vencidos') out = out.filter(isProfilePastDue);
  else if (st === 'vencendo') out = out.filter(isProfileDueSoon);
  else if (st === 'admins') out = out.filter(p => p.is_admin);
  else out = out.filter(p => p.subscription_status === st);
 }
 return out;
}

async function loadAdminProfiles(force = false) {
 if (!isAdminUser()) return;
 if (ADMIN_LOADING && !force) return;
 const hadData = Array.isArray(ADMIN_PROFILES) && ADMIN_PROFILES.length > 0;
 ADMIN_LOADING = true;
 if (!hadData) render();
 try {
   const { data, error } = await supabaseClient
    .from('profiles')
    .select('id,email,nome,subscription_status,subscription_plan,subscription_due_date,blocked,is_admin,created_at')
    .order('created_at', { ascending: false });
   if (error) throw error;
   ADMIN_PROFILES = data || [];
 } catch (error) {
   console.error(error);
   showToast('Não foi possível atualizar assinantes. Mantive a lista atual.');
   if (!ADMIN_PROFILES) ADMIN_PROFILES = [];
 } finally {
   ADMIN_LOADING = false;
   render();
 }
}


async function adminQuickSet(id, status, blocked, addDays = null) {
  if (!isAdminUser()) return showToast('Acesso restrito');
  const target = (ADMIN_PROFILES || []).find(p => p.id === id);
  if (ACTIVE_USER && id === ACTIVE_USER.id && target?.is_admin && (blocked || ['blocked','canceled'].includes(status))) {
    return showToast('Proteção: seu usuário admin não pode ser bloqueado por aqui');
  }
  if (document.getElementById('adm_status_' + id)) document.getElementById('adm_status_' + id).value = status;
  if (document.getElementById('adm_blocked_' + id)) document.getElementById('adm_blocked_' + id).value = String(!!blocked);
  if (addDays && document.getElementById('adm_due_' + id)) {
    const d = new Date();
    d.setDate(d.getDate() + addDays);
    document.getElementById('adm_due_' + id).value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  highlightAdminQuickAction(id, status, blocked);
  await adminSaveProfile(id);
}

function highlightAdminQuickAction(id, status, blocked) {
  const card = document.getElementById('admin_card_' + id);
  if (!card) return;
  card.querySelectorAll('.quick-action-btn').forEach(btn => btn.classList.remove('is-selected','active'));
  const buttons = card.querySelectorAll('.quick-action-btn');
  if (status === 'active' && !blocked) buttons[0]?.classList.add('is-selected','active');
  else if (status === 'past_due') buttons[1]?.classList.add('is-selected','active');
  else if (blocked || status === 'blocked') buttons[2]?.classList.add('is-selected','active');
}

async function adminSaveProfile(id) {
  if (!isAdminUser()) return showToast('Acesso restrito');
  const card = document.getElementById('admin_card_' + id);
  card?.classList.add('is-updating');
  const status = document.getElementById('adm_status_' + id)?.value || 'blocked';
  const plan = 'mensal';
  const dueRaw = document.getElementById('adm_due_' + id)?.value || null;
  let blocked = (document.getElementById('adm_blocked_' + id)?.value || 'false') === 'true';
  const target = (ADMIN_PROFILES || []).find(p => p.id === id);

  if (ACTIVE_USER && id === ACTIVE_USER.id && target?.is_admin && (blocked || ['blocked','canceled'].includes(status))) {
    blocked = false;
    if (document.getElementById('adm_blocked_' + id)) document.getElementById('adm_blocked_' + id).value = 'false';
    card?.classList.remove('is-updating');
    showToast('Proteção: seu usuário admin não pode ser bloqueado por aqui');
    return;
  }

  const payload = { subscription_status: status, subscription_plan: plan, subscription_due_date: dueRaw || null, blocked };
  const { error } = await supabaseClient.from('profiles').update(payload).eq('id', id);
  if (error) {
    console.error(error);
    card?.classList.remove('is-updating');
    return showToast('Erro ao salvar assinante');
  }
  if (Array.isArray(ADMIN_PROFILES)) {
    ADMIN_PROFILES = ADMIN_PROFILES.map(p => p.id === id ? { ...p, ...payload } : p);
  }
  showToast('Assinante atualizado com sucesso');
  renderPage();
  loadAdminProfiles(false);
}

function daysUntilDue(dateStr) {
  if (!dateStr) return 999999;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = parseDate(dateStr);
  if (!due) return 999999;
  return Math.ceil((due - today) / 86400000);
}

function handleImport(event) {
 const file = event.target.files[0];
 if (!file) return;
 
 const reader = new FileReader();
 reader.onload = (e) => {
  try {
   const imported = JSON.parse(e.target.result);
   if (!imported.config || !imported.receitas) {
    showToast('Arquivo inválido');
    return;
   }
   if (!confirm('Isso vai SUBSTITUIR todos os dados atuais. Continuar?')) {
    return;
   }
   DATA = imported;
   ensureMetasFormat();
   saveData();
   render();
   showToast('Dados importados com sucesso!');
  } catch (err) {
   showToast('Erro ao importar: ' + err.message);
  }
 };
 reader.readAsText(file);
 event.target.value = ''; // reset input
}

function cloudPayloadToData(payload) {

  userName: ACTIVE_PROFILE?.nome || '',

 };
 base.receitas = (payload.receitas || []).map((r, idx) => ({

  categoria: r.categoria || '',
  valor: r.valor === null ? null : Number(r.valor),
  descricao: r.descricao || ''
 }));
 base.despesas = (payload.despesas || []).map((d, idx) => ({
  id: idx + 1,
  data: d.data,
  dataPgto: d.data_pgto,
  categoria: d.categoria || '',
  sub: d.sub || '',
  valor: d.valor === null ? null : Number(d.valor),
  formaPgto: d.forma_pgto || '',

  desc: d.descricao || ''
 }));
 base.emprestimos = (payload.emprestimos || []).map((e, idx) => ({

  contato: e.contato || '',
  dataEmp: e.data_emp,
  dataAcordada: e.data_acordada,
  dataPgto: e.data_pgto,
  valor: e.valor === null ? null : Number(e.valor),
  juros: e.juros === null ? 0 : Number(e.juros),
  origem: e.origem || 'Próprio',
  donoTerceiro: e.dono_terceiro || '',
  obs: e.obs || ''
 }));
 base.donosTerceiros = (payload.donosTerceiros || []).map(d => d.nome).filter(Boolean);
 base.devolucoes = (payload.devolucoes || []).map((d, idx) => ({
  id: idx + 1,
  data: d.data,
  valor: d.valor === null ? null : Number(d.valor),
  destino: d.destino || '',
  obs: d.obs || ''
 }));
 base.investimentos = (payload.investimentos || []).map((i, idx) => ({
  id: idx + 1,
  data: i.data,
  tipo: i.tipo || '',
  movimento: i.movimento || '',
  valor: i.valor === null ? null : Number(i.valor),
  descricao: i.descricao || ''
 }));
 const aportesPorMeta = new Map();
 (payload.aportesMetas || []).forEach((a, idx) => {
  if (!aportesPorMeta.has(a.meta_id)) aportesPorMeta.set(a.meta_id, []);
  aportesPorMeta.get(a.meta_id).push({
   id: idx + 1,
   data: a.data,
   valor: a.valor === null ? 0 : Number(a.valor),
   origem: a.origem || '',

  });
 });
 base.metas = { lista: (payload.metas || []).map((m, idx) => ({

  obs: m.obs || '',
  aportes: aportesPorMeta.get(m.id) || []
 })) };
 ensureMetasFormatFor(base);
 return base;
}

function ensureMetasFormatFor(data) {
 if (!data.metas) data.metas = { lista: [] };
 if (!Array.isArray(data.metas.lista)) data.metas.lista = [];
 data.metas.lista.forEach((m, idx) => {
  if (!m.id) m.id = idx + 1;
  if (!Array.isArray(m.aportes)) m.aportes = [];
 });
}

async function persistDataToCloud(data, userId, opts = {}) {
 if (!userId || CLOUD_SYNCING) return;
 CLOUD_SYNCING = true;
 try {
  ensureMetasFormatFor(data);
  const cfg = data.config || {};
  const { error: deleteSettingsError } = await supabaseClient.from('user_settings').delete().eq('user_id', userId);
  if (deleteSettingsError) throw deleteSettingsError;
  const { error: settingsError } = await supabaseClient.from('user_settings').insert({
   user_id: userId,
   saldo_inicial: normalizeMoney(cfg.saldoInicial) || 0,
   data_corte: cfg.dataCorte || todayISO(),
   updated_at: new Date().toISOString()
  });
  if (settingsError) throw settingsError;

  const deleteOrder = ['aportes_metas','metas','receitas','despesas','emprestimos','donos_terceiros','devolucoes','investimentos'];
  for (const table of deleteOrder) {
   const { error } = await supabaseClient.from(table).delete().eq('user_id', userId);
   if (error) throw error;
  }

  const receitasRows = (data.receitas || []).map(r => ({ user_id:userId, data_prev:r.dataPrev || null, data_receb:r.dataReceb || null, categoria:r.categoria || null, valor:normalizeMoney(r.valor), descricao:r.descricao || null }));
  if (receitasRows.length) { const { error } = await supabaseClient.from('receitas').insert(receitasRows); if (error) throw error; }

  const despesasRows = (data.despesas || []).map(d => ({ user_id:userId, data:d.data || null, data_pgto:d.dataPgto || null, categoria:d.categoria || null, sub:d.sub || null, valor:normalizeMoney(d.valor), forma_pgto:d.formaPgto || null, necessario:d.necessario || null, descricao:d.desc || d.descricao || null }));
  if (despesasRows.length) { const { error } = await supabaseClient.from('despesas').insert(despesasRows); if (error) throw error; }

  const emprestimosRows = (data.emprestimos || []).map(e => ({ user_id:userId, nome:e.nome || null, contato:e.contato || null, data_emp:e.dataEmp || null, data_acordada:e.dataAcordada || null, data_pgto:e.dataPgto || null, valor:normalizeMoney(e.valor), juros:normalizeMoney(e.juros) || 0, origem:e.origem || null, dono_terceiro:e.donoTerceiro || null, obs:e.obs || null }));
  if (emprestimosRows.length) { const { error } = await supabaseClient.from('emprestimos').insert(emprestimosRows); if (error) throw error; }

  const donosRows = [...new Set(data.donosTerceiros || [])].filter(Boolean).map(nome => ({ user_id:userId, nome }));
  if (donosRows.length) { const { error } = await supabaseClient.from('donos_terceiros').insert(donosRows); if (error) throw error; }

  const devolucoesRows = (data.devolucoes || []).map(d => ({ user_id:userId, data:d.data || null, valor:normalizeMoney(d.valor), destino:d.destino || null, obs:d.obs || null }));
  if (devolucoesRows.length) { const { error } = await supabaseClient.from('devolucoes').insert(devolucoesRows); if (error) throw error; }

  const investimentosRows = (data.investimentos || []).map(i => ({ user_id:userId, data:i.data || null, tipo:i.tipo || null, movimento:i.movimento || null, valor:normalizeMoney(i.valor), descricao:i.descricao || null }));
  if (investimentosRows.length) { const { error } = await supabaseClient.from('investimentos').insert(investimentosRows); if (error) throw error; }

  for (const meta of (data.metas?.lista || [])) {
   const { data: insertedMeta, error: metaError } = await supabaseClient.from('metas').insert({
    user_id:userId,
    nome: meta.nome || 'Meta sem nome',
    valor_meta: normalizeMoney(meta.valorMeta) || 0,
    status: meta.status || 'Ativa',
    obs: meta.obs || null
   }).select('id').single();
   if (metaError) throw metaError;
   const aportesRows = (meta.aportes || []).map(a => ({ user_id:userId, meta_id:insertedMeta.id, data:a.data || aporteDateISO(a) || null, valor:normalizeMoney(a.valor) || 0, origem:a.origem || null, obs:a.obs || null }));
   if (aportesRows.length) { const { error } = await supabaseClient.from('aportes_metas').insert(aportesRows); if (error) throw error; }
  }

  if (opts.markMigration) {
   const { error } = await supabaseClient.from('user_migrations').upsert({ user_id:userId, localstorage_migrated:true, migrated_at:new Date().toISOString() }, { onConflict:'user_id' });
   if (error) throw error;
  }
  CLOUD_LAST_SYNC = new Date();
 } finally {
  CLOUD_SYNCING = false;
 }
}

function authRedirectUrl() {
 return window.location.origin + window.location.pathname;
}

function isPastDate(dateIso) {
 if (!dateIso) return false;
 const d = parseDate(dateIso);
 if (!d) return false;
 const hoje = new Date();
 hoje.setHours(0,0,0,0);
 return d < hoje;
}

function daysUntilDate(dateIso) {
 if (!dateIso) return null;
 const d = parseDate(dateIso);
 if (!d) return null;
 const hoje = new Date();
 hoje.setHours(0,0,0,0);
 return Math.ceil((d - hoje) / 86400000);
}

function getAccessState(userOrProfile) {
 const status = userOrProfile?.subscriptionStatus || userOrProfile?.subscription_status || 'blocked';
 const dueDate = userOrProfile?.dueDate || userOrProfile?.subscription_due_date || null;
 const isAdmin = !!(userOrProfile?.isAdmin || userOrProfile?.is_admin);

 if (userOrProfile?.blocked) return { allowed:false, status, reason:'blocked', message:'Seu acesso está bloqueado. Regularize sua assinatura para continuar.' };
 if (status === 'blocked') return { allowed:false, status, reason:'blocked', message:'Sua conta está aguardando liberação após confirmação do pagamento.' };
 if (status === 'canceled') return { allowed:false, status, reason:'canceled', message:'Sua assinatura está cancelada. Fale com o suporte para reativar.' };
 if (status === 'past_due') return { allowed:false, status, reason:'past_due', message:'Existe uma pendência de pagamento na sua assinatura.' };
 if (!isAdmin && isPastDate(dueDate)) return { allowed:false, status:'past_due', reason:'expired', message:'O vencimento da sua assinatura expirou. Regularize o pagamento para continuar.' };
 if (['trial', 'active'].includes(status) || isAdmin) return { allowed:true, status, reason:'ok', message:'' };
 return { allowed:false, status, reason:'unknown', message:'Não foi possível validar sua assinatura. Fale com o suporte.' };
}

function isAccessAllowed(userOrProfile) {
 return getAccessState(userOrProfile).allowed;
}

function subscriptionLabel(status) {
 const map = { trial:'Teste', active:'Ativa', past_due:'Pagamento pendente', blocked:'Bloqueada', canceled:'Cancelada' };
 return map[status] || status || 'Teste';
}

function subscriptionTagClass(status, blocked = false) {
 if (blocked || status === 'blocked' || status === 'canceled') return 'tag-danger';
 if (status === 'past_due') return 'tag-warning';
 if (status === 'active') return 'tag-success';
 return 'tag-accent';
}

function planLabel(plan) {
 return 'Mensal';
}

function getUserByEmail(email) {
 if (!ACTIVE_USER || normalizeEmail(email) !== normalizeEmail(ACTIVE_USER.email)) return null;
 return {
  email: ACTIVE_USER.email,
  subscriptionStatus: ACTIVE_PROFILE?.subscription_status || 'trial',
  blocked: !!ACTIVE_PROFILE?.blocked,
  plan: ACTIVE_PROFILE?.subscription_plan || 'mensal',
  dueDate: ACTIVE_PROFILE?.subscription_due_date || null,
  isAdmin: !!ACTIVE_PROFILE?.is_admin
 };
}

async function getProfile(user) {
 if (!user?.id) return null;
 let { data, error } = await supabaseClient
  .from('profiles')
  .select('id,email,nome,subscription_status,subscription_plan,subscription_due_date,blocked,is_admin')
  .eq('id', user.id)
  .single();

 if (error && error.code === 'PGRST116') {
  const inserted = await supabaseClient
   .from('profiles')
   .insert({ id: user.id, email: user.email, subscription_status: 'blocked', subscription_plan: 'mensal', blocked: true, is_admin: false })
   .select('id,email,nome,subscription_status,subscription_plan,subscription_due_date,blocked,is_admin')
   .single();
  data = inserted.data;
  error = inserted.error;
 }

 if (error) throw error;
 return data;
}

function simpleHash(str) {
 let h = 0;
 for (let i = 0; i < str.length; i++) {
  h = ((h << 5) - h) + str.charCodeAt(i);
  h |= 0;
 }
 return 'h_' + h + '_' + str.length;
}

 if (!file) return;
 const reader = new FileReader();
 reader.onload = (e) => {
  try {
   const imported = JSON.parse(e.target.result);
   if (!imported.config || !imported.receitas) return alert('Arquivo inválido');
   DATA = imported;
   if (!DATA.devolucoes) DATA.devolucoes = [];
   if (!DATA.donosTerceiros) DATA.donosTerceiros = ['Pai'];
   ensureMetasFormat();
   saveData();
   alert('Backup importado com sucesso. Entre ou crie uma conta para usar.');
  } catch (err) {
   alert('Erro ao importar backup');
  }
 };
 reader.readAsText(file);
 event.target.value = '';
});


// ============================================================
// INSTALAÇÃO PWA
// ============================================================
let deferredInstallPrompt = null;
let appWasInstalled = false;

function isRunningAsInstalledApp() {
 return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function updateInstallButtons() {
 const installed = isRunningAsInstalledApp() || appWasInstalled;
 document.querySelectorAll('[data-install-app]').forEach(btn => {
  btn.style.display = installed ? 'none' : 'flex';
 });
}

window.addEventListener('beforeinstallprompt', event => {
 event.preventDefault();
 deferredInstallPrompt = event;
 updateInstallButtons();
});

window.addEventListener('appinstalled', () => {
 appWasInstalled = true;
 deferredInstallPrompt = null;
 updateInstallButtons();
 showToast('App instalado com sucesso');
});

async function installApp() {
 if (isRunningAsInstalledApp()) {
  showToast('O app já está instalado');
  return;
 }

 if (deferredInstallPrompt) {
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice.catch(() => null);
  deferredInstallPrompt = null;
  updateInstallButtons();
  return;
 }

 showModal(`
  <div class="modal-title">Instalar app</div>
  <div style="font-size:14px;color:var(--text-secondary);line-height:1.7">
   <p><strong>Android/Chrome:</strong> se o aviso automático não aparecer, toque no menu de três pontos do navegador e escolha <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>.</p>
   <p style="margin-top:10px"><strong>iPhone/Safari:</strong> toque no botão de compartilhar e escolha <strong>Adicionar à Tela de Início</strong>.</p>
   <p style="margin-top:10px"><strong>Computador:</strong> no Chrome ou Edge, procure o ícone de instalação na barra de endereço ou use o menu do navegador.</p>
   <p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Após subir esta versão, envie também os arquivos <strong>manifest.webmanifest</strong>, <strong>sw.js</strong> e os ícones junto com o <strong>index.html</strong>.</p>
  </div>
  <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Entendi</button></div>
 `);
}


function hideStartupSplash() {
 const sp = document.getElementById('startupSplash');
 if (!sp) return;
 sp.classList.add('hide');
 setTimeout(() => { if (sp && sp.parentNode) sp.parentNode.removeChild(sp); }, 450);
}
window.addEventListener('load', () => setTimeout(hideStartupSplash, 520));
setTimeout(hideStartupSplash, 1200);

initLockScreen();

// FAB começa escondido (até desbloquear)
document.getElementById('fab').style.display = 'none';

// ============================================================
// INIT
// ============================================================
// render() é chamado em unlock()

// ESC fecha modal
document.addEventListener('keydown', e => {
 if (e.key === 'Escape') closeModal();
});

// Service Worker externo — necessário para instalação PWA real no GitHub Pages
if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((err) => {
   console.warn('Service Worker não registrado:', err);
  });
 });
}
</script>
